	function getScript(src) {
    var headElm = document.head || document.getElementsByTagName('head')[0];

    script.async = "async";

    script.src = src;
    script.onload = script.onreadystatechange = function() {
        if (once && (!script.readyState || /loaded|complete/.test(script.readyState))) {
            once = false;         
            script.onload = script.onreadystatechange = null;
			console.log("okeey");
        }
    };
	  headElm.appendChild(script);
}

 
	getScript("https://api.adinplay.com/libs/aiptag/pub/MNS/agario.cafe/tag.min.js");
 
	window.aiptag = window.aiptag || {cmd: []};
	aiptag.cmd.display = aiptag.cmd.display || [];
	aiptag.cmd.player = aiptag.cmd.player || [];

	//CMP tool settings
	aiptag.cmp = {
		show: true,
		position: "centered",  //centered, bottom
		button: true,
		buttonText: "Privacy settings",
		buttonPosition: "bottom-left" //bottom-left, bottom-right, top-left, top-right
	}

	aiptag.cmd.player.push(function() {
		aiptag.adplayer = new aipPlayer({
			AD_WIDTH: 960,

			LOADING_TEXT: 'loading advertisement',
			PREROLL_ELEM: function(){return document.getElementById('preroll')},
			AIP_COMPLETE: function (evt){ try{ if(window.__pr_cb){ window.__pr_cb(); } }catch(e){} finally{ window.__pr_cb=null; } },

			}
		});
	});
	
	 
 
				

function startGameFromPlay(e) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }

  window.__pr_cb = openGameAfterPreroll;

  try {
    if (typeof show_preroll === "function") {
      show_preroll();
    } 
  } catch (err) {
    openGameAfterPreroll();
  }

  return false;
}

<script>
function show_preroll() {

  if (
    typeof aiptag !== 'undefined' &&
    aiptag.adplayer &&
    typeof aiptag.adplayer.startPreRoll === 'function'
  ) {

    var p = document.getElementById('preroll');

    if (p) {
      p.style.display = 'block';
      p.style.visibility = 'visible';
      p.style.pointerEvents = 'auto';
    }

    aiptag.cmd.player.push(function () {
      aiptag.adplayer.startPreRoll();
    });

  } else {

    if (typeof window.openGameAfterPreroll === "function") {
      window.openGameAfterPreroll();
    }

  }
}
</script>
